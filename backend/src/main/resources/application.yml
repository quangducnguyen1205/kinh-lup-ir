spring:
  application:
    name: kinh-lup-backend
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kinhlup}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-timeout: 5000

server:
  port: ${BACKEND_PORT:8080}

kinhlup:
  extraction:
    max-bytes: ${EXTRACTION_MAX_BYTES:20971520}
    max-characters: ${EXTRACTION_MAX_CHARACTERS:2000000}
  admin:
    reindex-enabled: ${REINDEX_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  lucene:
    index-dir: ${LUCENE_INDEX_DIR:./data/lucene-index}
